<!doctype html><html lang="zh-CN" class="light"><head><meta charset="utf-8"><title>学习与代码笔记 - ChatGPT</title><style>
*{box-sizing:border-box}body{margin:0;background:#fafafa;color:#253730;font:16px/1.75 system-ui,sans-serif}nav.site{position:fixed;left:0;top:0;bottom:0;width:210px;background:#eef1ee;padding:25px}main{margin-left:210px;padding:36px 30px 180px}.max-w-thread{max-width:800px;margin:auto}article{padding:16px 0;border-bottom:1px solid #e4e8e3}[data-message-author-role=user]{background:#edf3ed;padding:12px 16px;border-radius:12px;margin-left:80px}pre{background:#e9efeb;padding:16px;overflow:auto;border-radius:12px}p{margin:10px 0}form{position:fixed;bottom:20px;left:calc(210px + 6%);right:calc(6% + var(--fixture-panel,0px));background:white;border:1px solid #ccc;border-radius:15px;padding:14px}html[data-cgpt-panel]{--fixture-panel:386px}#prompt-textarea{width:100%;min-height:54px;max-height:150px;overflow:auto;outline:none}h1{font-size:23px}button{cursor:pointer}@media(max-width:800px){nav.site{display:none}main{margin-left:0}form{left:20px;right:20px}}
</style></head><body><nav class="site">ChatGPT<br><br>＋ 新对话<br>搜索聊天<br><br>学习与代码笔记</nav><main><div class="max-w-thread"><h1>学习与代码笔记</h1><div id="messages"></div></div><form><div id="prompt-textarea" contenteditable="true" role="textbox" aria-label="发送消息"><p>已有草稿</p></div></form></main><script>
const messages=document.getElementById('messages');
for(let i=1;i<=6;i++){
 const user=document.createElement('article'); user.dataset.testid='conversation-turn-'+(i*2-1); user.innerHTML='<div data-message-author-role="user" data-message-id="u'+i+'">'+i+'. 请解释动态规划，并给出学习建议。</div>'; messages.append(user);
 const answer=document.createElement('article'); answer.dataset.testid='conversation-turn-'+(i*2); answer.innerHTML='<div data-message-author-role="assistant" data-message-id="a'+i+'"><p>动态规划把问题拆成相互关联的子问题。关键词测试：边界条件。</p><p>'+('明确状态、转移关系与边界条件。'.repeat(i===1?65:6))+'</p><pre><code class="language-js">'+Array.from({length:18},(_,n)=>'const step'+n+' = '+n+';').join('\n')+'</code></pre></div>'; messages.append(answer);
}
</script></body></html>
