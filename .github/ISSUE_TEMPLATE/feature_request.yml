name: 功能建议
description: 描述使用场景和希望解决的问题。
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题
      description: 当前操作有什么困难？已有功能为什么无法满足？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的行为
      description: 描述期望的操作与结果，以及考虑过的替代方法。
    validations:
      required: true
