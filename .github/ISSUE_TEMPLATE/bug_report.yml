name: 问题报告
description: 报告可复现的功能、页面兼容性或导出问题。
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请用合成或脱敏内容复现；提交前检查截图和导出文件，不要包含私人对话、账号信息或凭据。
  - type: input
    id: version
    attributes:
      label: 扩展版本
      description: 在扩展管理页或弹窗右上角查看。
      placeholder: 0.3.2
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 浏览器与操作系统
      placeholder: Chrome 版本 / macOS、Windows 或 Linux 版本
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 描述使用的功能、操作顺序以及相关页面结构；必要时附脱敏样例。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果与实际结果
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: 补充信息
      description: 可附脱敏截图、控制台错误或最小复现文件。
